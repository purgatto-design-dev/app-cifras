<title>App de Cifras</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&family=Noto+Music&display=swap">
<style>
/* Layout: app de uma tela. Celular = conteúdo + barra inferior; tablet/desktop = trilho lateral + conteúdo.
   Tema único escuro por escolha (palco). Cifra em fonte mono para alinhar acorde sobre letra. */
:root{
  color-scheme:dark;
  --bg:#0D0E0B; --surface:#161813; --surface-2:#1F221B; --line:#2C3026;
  --text:#F7F8F2; --muted:#C0C2B8; --dim:#8A8D82;
  --lime:#D5FF40; --lime-ink:#12150A; --lime-soft:rgba(213,255,64,.12);
  --danger:#FF7A66; --info:#7FD8FF;
  --f-ui:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --r-sm:10px; --r:16px; --r-lg:22px;
}
html{box-sizing:border-box;height:100%;background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:var(--f-ui);font-size:14px;line-height:1.5;-webkit-tap-highlight-color:transparent;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px;border-radius:8px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:18px;height:18px}

.app{display:flex;flex-direction:column;height:100%}
.view{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;position:relative}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 32px;max-width:980px;margin:0 auto}

/* Navegação */
.nav{order:2;display:flex;justify-content:space-around;align-items:center;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.choosing .nav{display:none}
.nav-b{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:52px;min-height:48px;justify-content:center;color:var(--dim);font-size:11px;font-weight:500;border-radius:12px}
.nav-b.on{color:var(--lime)}
.nav-plus{width:52px;height:52px;border-radius:18px;background:var(--lime);color:var(--lime-ink);display:grid;place-items:center;margin-top:-18px;box-shadow:0 6px 20px rgba(213,255,64,.25)}
.nav-plus svg.i{stroke-width:2.5}
@media (min-width:768px){
  .app{flex-direction:row}
  .nav{order:-1;flex-direction:column;justify-content:flex-start;gap:6px;width:92px;border-top:0;border-right:1px solid var(--line);padding:20px 8px}
  .nav-plus{margin:6px 0 10px;order:-1}
  .nav-brand{display:block!important}
}
.nav-brand{display:none;font-weight:700;font-size:12px;color:var(--lime);margin-bottom:8px;letter-spacing:.04em}

/* Tipografia e peças */
h1{font-size:26px;line-height:1.2;font-weight:700;margin:0;text-wrap:balance}
h2{font-size:18px;font-weight:600;margin:0}
.sub{color:var(--muted);font-size:13px;margin:2px 0 0}
.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:600}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:14px;font-weight:600;font-size:14px;background:var(--surface-2);border:1px solid var(--line)}
.btn.lime{background:var(--lime);color:var(--lime-ink);border-color:var(--lime)}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
.icon-b{width:44px;height:44px;display:grid;place-items:center;border-radius:14px;color:var(--text)}
.icon-b:hover{background:var(--surface-2)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;color:var(--muted)}
.input{min-height:46px;border-radius:14px;background:var(--surface);border:1px solid var(--line);padding:0 14px;width:100%}
.input:focus{border-color:var(--lime);outline:none}
textarea.input{padding:12px 14px;min-height:220px;font-family:var(--f-mono);font-size:13px;line-height:1.55;resize:vertical}
.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--dim)}
.search .input{padding-left:44px}
/* Filtros: botões que abrem popup (nada escondido em rolagem lateral) */
.filters{display:flex;flex-wrap:wrap;gap:8px}
.fbtn{min-height:44px;padding:0 12px 0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-weight:500;font-size:13px;display:inline-flex;align-items:center;gap:6px;max-width:100%}
.fbtn b{color:var(--text);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.fbtn.on{border-color:var(--lime);color:var(--lime);background:var(--lime-soft)}
.fbtn.on b{color:var(--lime)}
.fbtn.ghost{background:transparent;border-color:transparent}
.sh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px}
.sh h2 small{font-size:13px;color:var(--dim);font-weight:500;margin-left:6px}
.link-b{min-height:44px;padding:0 4px;color:var(--lime);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.olist{display:flex;flex-direction:column;gap:6px}
.olist.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr))}
.orow{display:flex;align-items:center;gap:10px;min-height:52px;padding:0 14px;border-radius:14px;background:var(--surface-2);border:1px solid transparent;text-align:left;width:100%;font-weight:500}
.orow .c{margin-left:auto;color:var(--dim);font-size:12px}
.orow.on{border-color:var(--lime);color:var(--lime)}
.olist.grid .orow{justify-content:center;font-family:var(--f-mono);font-weight:700}
.olist.grid .orow .c{margin-left:0}
.rgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:768px){.rgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.rcard{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:14px;border-radius:var(--r);background:var(--surface);border:1px solid transparent;text-align:left;min-width:0}
.rcard:hover{border-color:var(--line)}
.rcard .song-t,.rcard .song-s{display:block;width:100%}
.keytile.sm{width:40px;height:40px;font-size:14px;border-radius:12px}

/* Conta: entrar sem senha. Celular: só o formulário. Tablet deitado/desktop: amostra de cifra ao lado. */
.auth-wrap{min-height:100%;display:grid}
@media (min-width:900px){.auth-wrap{grid-template-columns:1fr 1fr}}
.auth-side{display:none}
@media (min-width:900px){.auth-side{display:flex;flex-direction:column;justify-content:center;gap:24px;padding:48px;background:var(--surface);border-right:1px solid var(--line)}}
.auth-art{font-family:var(--f-mono);font-size:30px;line-height:1.5}
.auth-art .sec{font-size:13px}
.auth-art b.c{color:var(--lime);font-weight:700}
.auth-tag{color:var(--muted);font-size:15px;max-width:340px;margin:0}
.auth-main{display:grid;place-items:center;padding:40px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px))}
.auth-in{width:100%;max-width:400px;display:flex;flex-direction:column}
.auth-in h1{font-size:30px;margin:6px 0 6px}
.auth-sso{justify-content:flex-start;padding:0 18px;min-height:52px;border-radius:16px}
.or{display:flex;align-items:center;gap:12px;color:var(--dim);font-size:12px;margin:4px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.aerr{color:var(--danger);font-size:13px;margin:0}
.code-in{font-family:var(--f-mono);font-size:26px;letter-spacing:.5em;text-align:center;min-height:60px}
.spin.sm{width:18px;height:18px;border-width:2px;margin:0;display:inline-block;border-top-color:var(--lime-ink)}

/* Tela de escolha do modo */
.mode-wrap{min-height:100%;display:grid;place-items:center;padding:40px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.mode-in{width:100%;max-width:760px}
.mode-in h1{font-size:30px;margin-top:6px}
.mode-grid{display:grid;gap:14px;margin-top:26px}
@media (min-width:600px){.mode-grid{grid-template-columns:1fr 1fr}}
.mode-card{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:22px;border-radius:24px;background:var(--surface);border:1px solid var(--line);min-height:210px}
.mode-card:hover{border-color:var(--lime)}
.mode-card .oi{width:56px;height:56px;border-radius:18px;background:var(--lime);color:var(--lime-ink);display:grid;place-items:center;margin-bottom:10px}
.mode-card .oi svg.i{width:26px;height:26px}
.mode-card b{font-size:20px;font-weight:700}
.mode-card span{color:var(--muted)}
.mode-card .mode-tabs{margin-top:auto;padding-top:12px;font-size:12px;color:var(--dim)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.lime{color:var(--lime);border-color:rgba(213,255,64,.4)}
.pill.warn{color:var(--danger);border-color:rgba(255,122,102,.45)}
.note{font-size:12px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:10px 12px}

/* Biblioteca */
.list{display:grid;gap:10px}
@media (min-width:900px){.list.two{grid-template-columns:1fr 1fr}}
.song{display:flex;align-items:center;gap:14px;text-align:left;padding:12px;border-radius:var(--r);background:var(--surface);border:1px solid transparent;width:100%;min-width:0}
.song:hover{border-color:var(--line)}
.keytile{width:52px;height:52px;border-radius:14px;background:var(--surface-2);display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:17px;color:var(--lime);flex:none}
.song-meta{flex:1;min-width:0;display:flex;flex-direction:column}
.song-t{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song-s{color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty svg{width:40px;height:40px;color:var(--dim);margin-bottom:8px}

/* Visualizador */
.topbar{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:6px;padding:8px max(8px,env(safe-area-inset-right,0px)) 8px max(8px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.topbar .t{flex:1;min-width:0}
.topbar .t b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .t span{display:block;font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vhead{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.vhead .topbar{position:static;border-bottom:0}
.keypill{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:12px;color:var(--muted);white-space:nowrap;flex:none;position:relative}
.keypill b{font-family:var(--f-mono);color:var(--lime);font-size:15px}
.keypill .dot,.step .val .dot{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--info)}
@media (max-width:479px){.hide-s{display:none}}

/* Botão de ajustes (canto inferior direito) e popup */
:root{--fab-b:calc(77px + env(safe-area-inset-bottom,0px))}
@media (min-width:768px){:root{--fab-b:24px}}
.performing{--fab-b:calc(92px + env(safe-area-inset-bottom,0px))}
.performing.nobar{--fab-b:calc(24px + env(safe-area-inset-bottom,0px))}
/* Trava de palco: cobre a tela; só segurando o botão destrava */
.lockcatch{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center;padding-bottom:calc(var(--fab-b) + 4px)}
.lockpill{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:8px;min-height:52px;padding:0 20px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--text);font-weight:600;font-size:13px;box-shadow:0 8px 28px rgba(0,0,0,.55);touch-action:none;user-select:none;-webkit-user-select:none}
.lockpill::before{content:"";position:absolute;inset:0;background:var(--lime-soft);transform:scaleX(0);transform-origin:left}
.lockpill.hold::before{transform:scaleX(1);transition:transform .7s linear}
.lockpill.nudge{animation:nudge .35s}
@keyframes nudge{30%{transform:translateX(-6px)}60%{transform:translateX(6px)}}
.count{position:fixed;inset:0;z-index:50;display:grid;place-items:center;font-size:120px;font-weight:700;color:var(--lime);background:rgba(13,14,11,.55);pointer-events:none}
/* Diagramas */
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-bottom:18px;font-family:var(--f-ui)}
.dcard{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 6px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.dcard b{font-family:var(--f-mono);color:var(--lime);font-size:14px}
svg.diag .dl{stroke:var(--muted);stroke-width:1}
svg.diag .dd{fill:var(--lime)}
svg.diag .do{fill:none;stroke:var(--muted);stroke-width:1.3}
svg.diag .dm{fill:var(--muted);font-size:10px;text-anchor:middle;font-family:var(--f-ui)}
svg.diag .dn{fill:var(--muted);font-size:9px;font-family:var(--f-ui)}
.dbig{display:flex;justify-content:center;padding:6px 0 10px}
/* Setlist editável */
.sl-item.edit{flex-wrap:wrap}
.sl-ctl{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;padding-left:34px;flex-wrap:wrap}
.step button:disabled{opacity:.3;cursor:not-allowed}
/* Editor por toque */
.tapedit{font-family:var(--f-mono);font-size:15px;line-height:1.5}
.te-line{margin:.15em 0 .35em}
.tw{display:inline-block;white-space:nowrap}
.tc{position:relative;display:inline-block;padding-top:1.35em;min-width:1ch;cursor:pointer;border-radius:4px}
.tc:hover{background:var(--surface-2)}
.tc.has{background:var(--lime-soft)}
.tch{position:absolute;top:0;left:0;font-style:normal;color:var(--lime);font-weight:700;white-space:nowrap;pointer-events:none}
.te-plain{white-space:pre-wrap;color:var(--muted);min-height:1.5em}
.te-chords{display:flex;flex-wrap:wrap;gap:6px;margin:.3em 0}
.te-chip{min-height:44px;min-width:44px;padding:0 12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);font-family:var(--f-mono);font-weight:700;color:var(--lime)}
.te-chip.add{color:var(--muted)}
.te-chip.on{background:var(--lime);color:var(--lime-ink);border-color:var(--lime)}
.chipwrap{display:flex;flex-wrap:wrap;gap:6px}
.fab-zone{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:var(--fab-b);z-index:22;display:flex;align-items:center;gap:10px}
.fab{position:relative;width:56px;height:56px;border-radius:18px;background:var(--lime);color:var(--lime-ink);display:grid;place-items:center;box-shadow:0 8px 28px rgba(0,0,0,.55)}
.fab svg.i{width:24px;height:24px;stroke-width:2.2}
.fab.open{background:var(--surface-2);color:var(--text);border:1px solid var(--line)}
.fab .badge{position:absolute;top:9px;right:9px;width:9px;height:9px;border-radius:50%;background:var(--info);box-shadow:0 0 0 2px var(--lime)}
.mini{width:52px;height:52px;border-radius:16px;background:var(--surface-2);border:1px solid var(--line);color:var(--text);display:grid;place-items:center;box-shadow:0 8px 28px rgba(0,0,0,.55)}
.mini[hidden]{display:none}
.mini.on{color:var(--lime);border-color:rgba(213,255,64,.5)}
.pop-catch{position:fixed;inset:0;z-index:21}
.pop{position:fixed;z-index:23;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(var(--fab-b) + 68px);width:min(360px,calc(100vw - 32px));max-height:calc(100dvh - var(--fab-b) - 150px);overflow-y:auto;background:var(--surface-2);border:1px solid var(--line);border-radius:22px;padding:4px 14px 14px;box-shadow:0 16px 48px rgba(0,0,0,.6)}
.prow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:62px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.prow b{display:block;font-weight:600;font-size:14px}
.prow .h{display:block;font-size:12px;color:var(--dim)}
.step{display:flex;align-items:center;gap:4px;flex:none}
.step button{width:44px;height:44px;border-radius:12px;background:var(--surface);display:grid;place-items:center;font-weight:700;font-size:13px}
.step button.on{background:var(--lime);color:var(--lime-ink)}
.step .val{font-family:var(--f-mono);font-weight:700;color:var(--lime);min-width:46px;text-align:center;font-size:16px;position:relative;line-height:44px}
.step .val.plain{color:var(--text)}
.step .val .dot{top:4px;right:2px}
.pnote{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding:10px 0;border-bottom:1px solid var(--line)}
.pnote .dot{width:7px;height:7px;border-radius:50%;background:var(--info)}
.pnote button{font-family:var(--f-mono);font-weight:700;color:var(--info);border:1px solid rgba(127,216,255,.4);border-radius:8px;padding:2px 10px;min-height:36px}
.pop .btn.block{margin-top:14px}
.banner{margin:10px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));display:flex;gap:10px;align-items:center;background:var(--lime-soft);border:1px solid rgba(213,255,64,.35);color:var(--lime);border-radius:12px;padding:10px 12px;font-size:12px;font-weight:500}
.sheet-scroll{overflow-x:hidden;padding:18px max(16px,env(safe-area-inset-right,0px)) 160px max(16px,env(safe-area-inset-left,0px))}
.sheet-wrap{position:relative;width:100%;font-family:var(--f-mono);line-height:1.6}
.sheet-wrap.blank{min-height:1400px;background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:24px 24px}
/* A cifra quebra a linha (nada de rolar para o lado); só a tablatura, que não pode quebrar, rola no próprio bloco */
.sheet{color:var(--text);padding-bottom:20px}
.ln{min-height:1.6em;white-space:pre-wrap;overflow-wrap:anywhere}
.sheet b.c{color:var(--lime);font-weight:700;cursor:pointer}
.sheet .n{color:var(--dim)}
.ln.pair{white-space:normal;margin:.1em 0 .25em}
.grp{display:inline-flex;align-items:flex-end;vertical-align:bottom}
.cell{display:inline-flex;flex-direction:column}
.cell b.c,.cell .n,.cell .c0{white-space:pre;line-height:1.3}
.cell b.c,.cell .n{padding-right:.7ch}
.cell.free b.c,.cell.free .n{width:0;overflow:visible;padding-right:0}
.cell .ly{white-space:pre;line-height:1.45}
.tabblk{overflow-x:auto;margin:.2em 0;scrollbar-width:thin}
.tabblk .ln{white-space:pre;overflow-wrap:normal;width:max-content}
.ln.tab{color:var(--muted)}
.sheet.cols2{column-count:2;column-gap:56px}
.sheet.cols2 .part{break-inside:avoid}
.sec{display:inline-block;font-family:var(--f-ui);font-weight:600;font-size:.72em;letter-spacing:.06em;text-transform:uppercase;color:var(--lime-ink);background:var(--muted);border-radius:6px;padding:0 .6em;margin:.9em 0 .2em;line-height:1.7}
.sec-row .sec{margin-right:1ch}
canvas.ink{position:absolute;inset:0;pointer-events:none;touch-action:auto}
.editing canvas.ink{pointer-events:auto;touch-action:none;cursor:crosshair}
.editing.tool-hand canvas.ink,.editing.tool-note canvas.ink{pointer-events:none}
/* Partitura: papel claro como a folha pautada impressa */
.scorewrap{font-family:var(--f-ui)}
.paper{background:#FBFBF8;color:#16170F;border-radius:6px;padding:28px 20px 48px;margin:0 auto;max-width:100%;box-shadow:0 10px 40px rgba(0,0,0,.45)}
.paper-title,.paper-comp{display:block;margin:0 auto;text-align:center;color:#16170F;font-family:var(--f-ui);min-height:36px;padding:2px 12px;border-radius:8px}
.paper-title{font-size:20px;font-weight:600}
.paper-comp{font-size:13px;color:#55574C}
.paper-title.empty,.paper-comp.empty{color:#A3A597;font-weight:400;border-bottom:1px dashed #C9CABF;border-radius:0;min-width:60%}
.paper-tempo{font-size:13px;color:#55574C;margin:8px 0 4px}
svg.sys{display:block;overflow:visible;margin-top:2px}
svg.sys .st{stroke:#2A2B24;stroke-width:1}
svg.sys .bar{stroke:#16170F;stroke-width:1.4}
svg.sys .bar.over{stroke:#D24B37;stroke-width:2}
svg.sys .head{fill:#16170F}
svg.sys .head.open{fill:#FBFBF8;stroke:#16170F;stroke-width:1.6}
svg.sys .stem{stroke:#16170F;stroke-width:1.3}
svg.sys .flag{fill:none;stroke:#16170F;stroke-width:1.6;stroke-linecap:round}
svg.sys .ink-f{fill:#16170F}
svg.sys .mus{fill:#16170F;font-family:'Noto Music','Segoe UI Symbol','Apple Symbols',serif}
svg.sys .tsig{fill:#16170F;font-family:Georgia,'Times New Roman',serif;font-weight:700}
svg.sys .caret{stroke:#1E6BD6;stroke-width:2.5;stroke-dasharray:4 3}
svg.sys .selbg{fill:rgba(30,107,214,.14);stroke:#1E6BD6;stroke-width:1.2}
svg.sys .nt.pl .head,svg.sys .nt.pl .stem,svg.sys .nt.pl .flag{fill:#1E6BD6;stroke:#1E6BD6}
.editing.tool-note svg.sys{cursor:crosshair}
.mus{font-family:'Noto Music','Segoe UI Symbol','Apple Symbols',serif}
.mus.big{font-size:26px;line-height:1}
.npal{display:flex;flex-wrap:wrap;align-items:center;gap:4px;padding:0 max(12px,env(safe-area-inset-right,0px)) 6px max(12px,env(safe-area-inset-left,0px))}
.nb{min-width:44px;height:44px;padding:0 10px;border-radius:12px;background:var(--surface);color:var(--text);font-weight:600;font-size:13px;display:grid;place-items:center}
.nb .mus{font-size:22px;line-height:1}
.nb.on{background:var(--lime);color:var(--lime-ink)}
.npal .sep{width:1px;height:28px;background:var(--line);margin:0 4px}
.nstatus{margin:0;padding:0 max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));font-size:12px;color:var(--muted)}

/* Modo edição: ferramentas numa faixa sob o título (sem rolagem lateral) */
.edstrip{display:flex;flex-wrap:wrap;align-items:center;gap:4px;padding:0 max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px))}
.edstrip .tb{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--muted);background:var(--surface);flex:none}
.edstrip .tb.on{background:var(--lime);color:var(--lime-ink)}
.edstrip .sep{width:1px;height:28px;background:var(--line);margin:0 2px;flex:none}
.edstrip .sw{width:32px;height:32px;border-radius:50%;flex:none;border:2px solid transparent}
.edstrip .sw.on{border-color:var(--text);box-shadow:0 0 0 2px var(--bg) inset}
.layer-tag{flex:none;font-size:11px;font-weight:700;padding:4px 10px;color:var(--lime);white-space:nowrap;border:1px solid rgba(213,255,64,.4);border-radius:999px}
.topbar .btn{min-height:44px;padding:0 14px;flex:none}

/* Modal */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.modal{width:100%;max-height:92%;overflow-y:auto;background:var(--surface);border-radius:24px 24px 0 0;border:1px solid var(--line);border-bottom:0;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal .grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 14px}
@media (min-width:768px){.scrim{align-items:center}.modal{max-width:560px;border-radius:24px;border-bottom:1px solid var(--line);padding:22px 24px 24px}.modal .grab{display:none}}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;width:100%;padding:14px;border-radius:var(--r);background:var(--surface-2);border:1px solid var(--line);min-height:64px}
.opt:hover:not(:disabled){border-color:var(--lime)}
.opt:disabled{opacity:.45;cursor:not-allowed}
.opt .oi{width:44px;height:44px;border-radius:14px;background:var(--bg);display:grid;place-items:center;color:var(--lime);flex:none}
.opt b{display:block;font-weight:600;font-size:15px}
.opt span{display:block;font-size:12px;color:var(--muted)}
.opt.lime .oi{background:var(--lime);color:var(--lime-ink)}
.fmt-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fmt-grid .opt{flex-direction:column;align-items:flex-start;gap:10px;min-height:120px}
.spin{width:36px;height:36px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--lime);animation:sp 0.8s linear infinite;margin:10px auto}
@keyframes sp{to{transform:rotate(360deg)}}

/* Banda / palco */
.card{background:var(--surface);border-radius:var(--r);padding:16px;border:1px solid transparent;text-align:left;width:100%;display:block}
button.card:hover{border-color:var(--line)}
.seg{display:flex;background:var(--surface);border-radius:14px;padding:4px;gap:4px;margin-bottom:16px}
.seg button{flex:1;min-height:40px;border-radius:10px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--surface-2);color:var(--text)}
.member{display:flex;align-items:center;gap:12px;padding:12px;background:var(--surface);border-radius:var(--r)}
.av{width:40px;height:40px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-weight:700;color:var(--muted);flex:none}
.member .mm{flex:1;min-width:0}
.member .mm b{display:block;font-weight:600}
.member .mm span{font-size:12px;color:var(--dim)}
.switch{width:48px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--text);transition:transform .15s}
.switch.on{background:var(--lime)}
.switch.on::after{transform:translateX(20px);background:var(--lime-ink)}
.sl-item{display:flex;align-items:center;gap:12px;padding:12px;background:var(--surface);border-radius:var(--r)}
.sl-n{font-family:var(--f-mono);color:var(--dim);width:22px;text-align:center;font-weight:700}
.big-cta{min-height:56px;font-size:15px;border-radius:18px}

/* Modo palco */
.performing .nav{display:none}
.stagebar{display:flex;align-items:center;gap:10px;position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);padding:10px max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.stagebar .nx{flex:1;min-width:0;display:flex;align-items:center;justify-content:flex-end;gap:10px;text-align:right;min-height:56px;border-radius:16px;background:var(--surface-2);padding:0 14px}
.stagebar .nx b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stagebar .nx span{display:block;font-size:11px;color:var(--dim)}
.stagebar .pv{width:56px;height:56px;border-radius:16px;background:var(--surface-2);display:grid;place-items:center;flex:none}
.stagebar .pv:disabled,.stagebar .nx:disabled{opacity:.35}

.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%) translateY(-20px);opacity:0;z-index:60;background:var(--text);color:var(--bg);font-weight:600;font-size:13px;padding:12px 16px;border-radius:14px;max-width:calc(100% - 32px);transition:all .2s;pointer-events:none;display:flex;gap:8px;align-items:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

    }

function ago(t){
  const min = (Date.now()-t)/60000, d = new Date(t), now = new Date(), hm = d.toTimeString().slice(0,5);
  if(min < 1) return 'agora';
  if(min < 60) return `há ${Math.floor(min)} min`;
  if(d.toDateString() === now.toDateString()) return 'hoje, ' + hm;
  if(d.toDateString() === new Date(now - 864e5).toDateString()) return 'ontem, ' + hm;
  return `${d.getDate()} ${MON[d.getMonth()]}`;
}

/* Editor por toque: cada letra da linha é um alvo; o acorde fica preso à coluna da sílaba.
   As palavras quebram linha inteiras, então funciona no celular sem rolar para o lado. */
function tapLineHTML(ci, li, chLine, lyric){
  const at = {}; chLine.replace(/\S+/g, (t, i) => { at[i] = t; return t; });
  const cols = Object.keys(at).map(Number), len = Math.max(lyric.length, cols.length ? Math.max(...cols) + 1 : 0, 1);
  let out = '', word = false;
  for(let c = 0; c < len; c++){
    const ch = lyric[c] || ' ', sp = ch === ' ';
    if(sp && word){ out += '</span>'; word = false; }
    if(!sp && !word){ out += '<span class="tw">'; word = true; }
    out += `<span class="tc ${at[c]?'has':''}" data-act="tapch" data-ci="${ci ?? ''}" data-li="${li}" data-c="${c}">${at[c] ? `<i class="tch">${esc(at[c])}</i>` : ''}${sp ? '&nbsp;' : esc(ch)}</span>`;
  }
  if(word) out += '</span>';
  return `<div class="te-line">${out}</div>`;
}
function tapEditorHTML(text){
  const L = text.split('\n'); let h = '';
  for(let i = 0; i < L.length; i++){
    const line = L[i];
    if(isTabLine(line) || isSecLine(line)){ h += `<div class="te-plain">${esc(line)}</div>`; continue; }
    if(chordRowAt(L, i)){
      if(isLyric(L[i+1])){ h += tapLineHTML(i, i+1, line, L[i+1]); i++; continue; }
      const toks = []; line.replace(/\S+/g, (t, c) => { toks.push([c, t]); return t; });
      h += `<div class="te-chords">${toks.map(([c,t]) => `<button class="te-chip" data-act="tapch" data-ci="${i}" data-li="" data-c="${c}">${esc(t)}</button>`).join('')}<button class="te-chip add" data-act="tapch" data-ci="${i}" data-li="" data-c="${line.length + 2}" aria-label="Adicionar acorde nesta linha">＋</button></div>`; continue;
    }
    if(!line.trim()){ h += '<div class="te-plain">&nbsp;</div>'; continue; }
    h += tapLineHTML(null, i, '', line);
  }
  return h;
}
/* Coloca (ou tira, se chord vazio) um acorde na coluna c de uma linha de acordes, sem encavalar com os vizinhos */
function placeChord(line, c, chord){
  const toks = []; line.replace(/\S+/g, (t, i) => { if(i !== c) toks.push([i, t]); return t; });
  if(chord) toks.push([c, chord]);
  toks.sort((a, b) => a[0] - b[0]);
  let out = ''; for(const [i, t] of toks){ out = out.padEnd(Math.max(i, out.length ? out.length + 1 : 0), ' ') + t; }
  return out;
}
function setChordAt(p, ci, li, c, chord){
  const L = p.text.split('\n');
  if(ci === null){ if(!chord) return; L.splice(li, 0, ''); ci = li; }
  L[ci] = placeChord(L[ci], c, chord);
  if(!L[ci].trim() && li !== null) L.splice(ci, 1); // linha de acordes vazia sobre a letra: some
  p.text = L.join('\n');
}

}

/* ---------- Tinta (caneta, marca-texto, borracha) ---------- */
let ink, ctx2, drawing = null, hist = {u:[], r:[]}, bandSnap = null;
function mountInk(){
  ink = document.getElementById('ink'); if(!ink) return;
  ctx2 = ink.getContext('2d');
  sizeInk();
  ink.onpointerdown = down; ink.onpointermove = move; ink.onpointerup = ink.onpointercancel = up;
}
function sizeInk(){
  const w = document.getElementById('sw'); if(!w || !ink) return;
  const dpr = Math.min(window.devicePixelRatio||1, 2), W = w.offsetWidth, H = w.offsetHeight;
  ink.width = W*dpr; ink.height = H*dpr; ink.style.width = W+'px'; ink.style.height = H+'px';
  ctx2.setTransform(dpr,0,0,dpr,0,0); redraw();
}
function drawStroke(s){
  const fs = V.fs, p = s.pts; if(!p.length) return;
  ctx2.save(); ctx2.globalAlpha = s.tool==='hl' ? .32 : 1; ctx2.strokeStyle = s.color;
  ctx2.lineWidth = (s.tool==='hl' ? 1.05 : .14) * fs; ctx2.lineCap = s.tool==='hl'?'butt':'round'; ctx2.lineJoin = 'round';
  ctx2.beginPath(); ctx2.moveTo(p[0][0]*fs, p[0][1]*fs);
  if(p.length === 1) ctx2.lineTo(p[0][0]*fs+.5, p[0][1]*fs);
  for(let i=1;i<p.length-1;i++){ const mx=(p[i][0]+p[i+1][0])/2*fs, my=(p[i][1]+p[i+1][1])/2*fs; ctx2.quadraticCurveTo(p[i][0]*fs,p[i][1]*fs,mx,my); }
  if(p.length>1) ctx2.lineTo(p[p.length-1][0]*fs, p[p.length-1][1]*fs);
  ctx2.stroke(); ctx2.restore();
}
function redraw(){
  if(!ctx2) return; ctx2.clearRect(0,0,ink.width,ink.height);
  if(V.ctx?.band) strokes('band').forEach(drawStroke);
  strokes('me').forEach(drawStroke);
  if(drawing && drawing.tool!=='eraser') drawStroke(drawing);
}
const pt = e => { const r = ink.getBoundingClientRect(); return [(e.clientX-r.left)/V.fs, (e.clientY-r.top)/V.fs]; };
function snapshot(){ hist.u.push(strokes(V.layer).slice()); hist.r = []; }
/* Caneta × dedo: quando o app percebe uma caneta (Apple Pencil), passa a valer "só a caneta desenha":
   o dedo arrasta a página e a caneta escreve, sem trocar de ferramenta. */
let panning = null;
function down(e){
  if(!V.edit || V.tool==='hand') return;
  if(e.pointerType==='pen' && !DB.prefs.penOnly){ DB.prefs.penOnly = true; save(); toast('Caneta detectada: agora a caneta escreve e o dedo rola a página'); }
  e.preventDefault(); try { ink.setPointerCapture(e.pointerId); } catch(err){}
  if(DB.prefs.penOnly && e.pointerType==='touch'){ panning = {y:e.clientY, x:e.clientX}; return; }
  snapshot();
  drawing = {tool:V.tool, color:V.color, pts:[pt(e)]};
  if(V.tool==='eraser') eraseAt(pt(e)); else redraw();
}
function move(e){
  if(panning){ view.scrollTop -= e.clientY - panning.y; panning.y = e.clientY; return; }
  if(!drawing) return; e.preventDefault();
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  for(const ev of evs){ const p = pt(ev); if(drawing.tool==='eraser') eraseAt(p); else drawing.pts.push(p); }
  redraw();
}
function up(){
  panning = null;
  if(!drawing) return;
  if(drawing.tool!=='eraser') strokes(V.layer).push(drawing);
  if(drawing.tool==='eraser' && hist.u.length && hist.u[hist.u.length-1].length===strokes(V.layer).length) hist.u.pop();
  drawing = null; save(); redraw(); updateUndoUI();
}
/* Desfazer/refazer só aparecem quando há o que desfazer/refazer */
function updateUndoUI(){
  const u = document.getElementById('b-undo'), r = document.getElementById('b-redo'), h = undoStack();
  if(u) u.hidden = !h.u.length; if(r) r.hidden = !h.r.length;
}
/* Muda a nota selecionada (com desfazer) ou, sem seleção, a figura da próxima nota */
function editNote(onNote, onNext){
  const sc = song(V.id).score;
  if(V.sel != null && sc.notes[V.sel]){ pushNotes(); onNote(sc.notes[V.sel]); save(); }
  else if(onNext) onNext();
  rerenderViewer();
}
function eraseAt([x,y]){
  const arr = strokes(V.layer), r = .7;
  for(let i=arr.length-1;i>=0;i--) if(arr[i].pts.some(([a,b]) => (a-x)**2+(b-y)**2 < r*r)) arr.splice(i,1);
}

/* ---------- Rolagem automática e tela acesa ---------- */
/* Rolagem pela duração da música: a página inteira passa no tempo que a música dura. Começa com contagem 3-2-1. */
let raf = null, lastT = 0, acc = 0, cdT = null;
function tick(t){
  if(!V?.playing) return;
  const rate = Math.max(4, (view.scrollHeight - view.clientHeight) / songDur(song(V.id))); // px por segundo
  if(lastT){ acc += (t-lastT)/1000 * rate; const n = Math.floor(acc); if(n){ view.scrollTop += n; acc -= n; } }
  lastT = t;
  if(view.scrollTop + view.clientHeight >= view.scrollHeight - 2){ V.playing = false; rerenderViewer(); return; }
  raf = requestAnimationFrame(tick);
}
function stopScroll(){
  if(V?.splaying) stopScore();
  if(V){ V.playing = false; V.counting = false; }
  cancelAnimationFrame(raf); lastT = 0; clearInterval(cdT); document.querySelectorAll('.count').forEach(n => n.remove());
}
function togglePlay(){
  if(V.playing || V.counting){ stopScroll(); rerenderViewer(); return; }
  V.pop = false; V.counting = true; rerenderViewer();
  let n = 3; const el = document.createElement('div'); el.className = 'count'; el.setAttribute('role','status'); el.textContent = n; document.body.appendChild(el);
  cdT = setInterval(() => { n--; if(n > 0){ el.textContent = n; return; }
    clearInterval(cdT); el.remove(); if(!V?.counting) return; V.counting = false; V.playing = true; lastT = 0; acc = 0; raf = requestAnimationFrame(tick); rerenderViewer(); }, 800);
}
/* Cabe a música inteira na tela: procura o maior tamanho de letra em que ela não precisa rolar */
function fitToScreen(){
  V.pop = false; const head = () => document.querySelector('.vhead')?.offsetHeight || 0;
  const bar = document.querySelector('.stagebar')?.offsetHeight || 0;
  let lo = 11, hi = 40, best = 0;
  while(lo <= hi){ const mid = (lo + hi) >> 1; V.fs = mid; render();
    const avail = view.clientHeight - head() - bar - 30, h = document.getElementById('sw').offsetHeight + (document.querySelector('.dgrid')?.offsetHeight || 0);
    if(h <= avail){ best = mid; lo = mid + 1; } else hi = mid - 1; }
  V.fs = best || 11; render();
  toast(best ? `A música inteira coube na tela (letra ${best}px)` : wide() && DB.prefs.cols!==2 ? 'Não coube inteira: tente 2 colunas' : 'Não coube inteira nem com a letra mínima: use a rolagem');
}
let lock = null;
async function wake(on){
  try{ if(on && !lock && navigator.wakeLock){ lock = await navigator.wakeLock.request('screen'); }
       if(!on && lock){ await lock.release(); lock = null; } }catch(e){ lock = null; }
}
function rerenderViewer(){ const y = view.scrollTop; render(); view.scrollTop = y; }

/* ---------- Toast ---------- */
let tt; const toastEl = document.getElementById('toast');
function toast(msg){ toastEl.innerHTML = ic('check','sm') + `<span>${esc(msg)}</span>`; toastEl.classList.add('show'); clearTimeout(tt); tt = setTimeout(()=>toastEl.classList.remove('show'), 2800); }

  edmode: el => { readMeta(); S.pending.mode = el.dataset.v; render(); },
  tapch: el => { const d = el.dataset, ci = d.ci === '' ? null : +d.ci, li = d.li === '' ? null : +d.li, c = +d.c;
    const L = S.pending.text.split('\n'), curTok = ci !== null ? (L[ci].slice(c).match(/^\S+/)?.[0] || '') : '';
    const atStart = ci !== null && (c === 0 || L[ci][c-1] === ' ' || L[ci][c-1] === undefined);
    openModal({name:'chordpick', ci, li, c, cur: atStart ? curTok : ''}); },
  chordset: el => { const m = S.modal; readMeta(); setChordAt(S.pending, m.ci, m.li, m.c, el.dataset.v); closeModal(); render(); },
  chordtyped: () => { const v = document.getElementById('m-ch').value.trim().replace(/\s+/g,'');
    if(v && !isChord(v)){ toast('Não reconheci “' + v + '” como acorde. Ex.: G, Am, F#m7, A7M, D/F#'); return; }
    const m = S.modal; setChordAt(S.pending, m.ci, m.li, m.c, v); closeModal(); render(); },
  movefolder: () => { V.pop = false; rerenderViewer(); openModal({name:'folder'}); },
  tofolder: el => { const f = el.dataset.v, a = DB.folderOf[V.id] = DB.folderOf[V.id]||[]; const i = a.indexOf(f); if(i<0){a.push(f); toast('Adicionada à pasta '+f);} else {a.splice(i,1); toast('Removida da pasta '+f);} save(); closeModal(); },
  edit: () => {
    V.pop = false;
    if(V.ctx?.band){ rerenderViewer(); const c = cur(); const it = c.name==='perform' ? DB.setlists.find(x=>x.id===c.sl).items[c.i] : null; openModal({name:'choice', item:it}); }
    else { V.edit = true; V.layer = 'me'; hist = {u:[],r:[]}; if(song(V.id).score){ V.tool = 'note'; V.sel = null; } rerenderViewer(); }
  },
  startedit: el => { closeModal(); V.edit = true; V.layer = el.dataset.v; V.tool = song(V.id).score ? 'note' : 'pen'; hist = {u:[],r:[]}; if(V.layer==='band') bandSnap = strokes('band').slice(); stopScroll(); rerenderViewer(); },
  tool: el => { V.tool = el.dataset.v; rerenderViewer(); },
  color: el => { V.color = el.dataset.v; if(V.tool==='eraser'||V.tool==='hand') V.tool = 'pen'; rerenderViewer(); },
  undo: () => { if(isNoteUndo()){ const h = undoStack(), sc = song(V.id).score; if(!h.u.length) return; h.r.push(JSON.stringify(sc.notes)); sc.notes = JSON.parse(h.u.pop()); V.sel = null; save(); rerenderViewer(); return; }
    if(!hist.u.length) return; hist.r.push(strokes(V.layer).slice()); DB.ann[annKey(V.layer,V.st)] = hist.u.pop(); save(); redraw(); updateUndoUI(); },
  redo: () => { if(isNoteUndo()){ const h = undoStack(), sc = song(V.id).score; if(!h.r.length) return; h.u.push(JSON.stringify(sc.notes)); sc.notes = JSON.parse(h.r.pop()); V.sel = null; save(); rerenderViewer(); return; }
    if(!hist.r.length) return; hist.u.push(strokes(V.layer).slice()); DB.ann[annKey(V.layer,V.st)] = hist.r.pop(); save(); redraw(); updateUndoUI(); },
  /* Partitura: figura, pausa, ponto, acidente (valem para a próxima nota, ou para a nota selecionada) */
  nd: el => editNote(n => { n.d = el.dataset.v; }, () => { V.nd = el.dataset.v; }),
  nrest: () => editNote(n => { n.rest = !n.rest; if(n.rest) n.acc = null; }, () => { V.nrest = !V.nrest; }),
  ndot: () => editNote(n => { n.dot = !n.dot; }, () => { V.ndot = !V.ndot; }),
  nacc: el => editNote(n => { if(!n.rest) n.acc = n.acc === el.dataset.v ? null : el.dataset.v; }, () => { V.nacc = V.nacc === el.dataset.v ? null : el.dataset.v; }),

  readlink: async () => {
    const raw = document.getElementById('m-url').value.trim(); let url;
    try { url = new URL(/^https?:\/\//i.test(raw) ? raw : 'https://' + raw); if(!raw || !url.hostname.includes('.')) throw 0; }
    catch(e){ toast('Cole o endereço completo da cifra'); return; }
    const m = S.modal; Object.assign(m, {step:'loading', url:url.href, host:url.hostname.replace(/^www\./,'')}); drawModal();
    let why = 'blocked', got = null;
    try {
      const ctrl = new AbortController(), tm = setTimeout(() => ctrl.abort(), 9000);
      const res = await fetch(url.href, {signal:ctrl.signal, credentials:'omit'}); clearTimeout(tm);
      if(res.ok){ got = extractCifra(await res.text()); if(!got) why = 'nocifra'; }
    } catch(e){ /* bloqueado pelo site (CORS), pela página ou sem rede */ }
    if(S.modal !== m) return; // a pessoa fechou ou voltou enquanto lia
    if(!got){ m.step = 'linkfail'; m.why = why; drawModal(); return; }
    closeModal(); S.pending = {...got, key:detectKey(got.text), fmt:got.text.split('\n').some(isTabLine)?'Cifra + tab':'Cifra', source:'link', url:url.href}; go('preview');

    closeModal(); S.pending = {title: t===PASTE_SAMPLE?'Noite de Junho':'Sem título', artist: t===PASTE_SAMPLE?'Artista Exemplo':'', genre: t===PASTE_SAMPLE?'Forró':'', key:detectKey(t), text:t, fmt: t.split('\n').some(isTabLine)?'Cifra + tab':'Cifra', source:'paste'}; go('preview'); },
  savepending: () => { readMeta(); const id = addSong(S.pending); toast('Salva na biblioteca'); S.tab='lib'; S.stack=[{name:'lib'}]; openSong(id); go('song'); },
  zero: el => {
    const f = el.dataset.v; closeModal();
    const tpl = {'Cifra':'[Primeira Parte]\nC           G\nEscreva a letra aqui\nAm          F\ncom os acordes na linha de cima\n',
      'Cifra + tab':'[Intro]\ne|-----------------|\nB|-----------------|\nG|-----------------|\nD|-----------------|\nA|-----------------|\nE|-----------------|\n\n[Primeira Parte]\nC           G\nEscreva a letra aqui\n',
      'Tablatura':'[Riff]\ne|-----------------|\nB|-----------------|\nG|-----------------|\nD|-----------------|\nA|-----------------|\nE|-----------------|\n'}[f];
    if(f==='Partitura'){ const id = addSong({title:'Sem título', artist:'', genre:'Partituras', key:'C', fmt:'Partitura', text:'', score:newScore()});
      openSong(id); V.edit = true; V.tool = 'note'; S.tab='lib'; S.stack=[{name:'lib'}]; go('song');
      toast('Toque na pauta para pôr a nota. Escolha a figura na barra de cima.'); return; }
    if(f==='Folha em branco'){ const id = addSong({title:'Folha em branco', artist:'Autoral', genre:'Rascunhos', key:'C', fmt:'Folha em branco', text:''}); openSong(id); V.edit = true; S.tab='lib'; S.stack=[{name:'lib'}]; go('song'); return; }
    S.pending = {title:'', artist:'', key:'C', genre:'', fmt:f, text:tpl}; go('editor');
  },
  edprev: el => { readMeta(); S.pending.showPrev = el.dataset.v==='1'; render(); },
  saveeditor: () => { readMeta(); const p = S.pending;
    if(p.editId){ Object.assign(song(p.editId), {title:p.title, artist:p.artist, key:p.key, genre:p.genre, text:p.text, edited:true}); save(); back(); toast('Texto da cifra salvo'); return; }
    const id = addSong(p); toast('Salva na biblioteca'); S.tab='lib'; S.stack=[{name:'lib'}]; openSong(id); go('song'); },
  openband: el => { S.bandTab = 'rep'; go('band', {id:el.dataset.id}); },
  bandtab: el => { S.bandTab = el.dataset.v; render(); },
  approve: el => { const b = band(el.dataset.b), p = b.pending.splice(+el.dataset.i,1)[0]; b.members.push({n:p.n, r:'membro', i:p.i}); save(); render(); toast(p.n+' entrou na banda'); },
  deny: el => { const b = band(el.dataset.b), p = b.pending.splice(+el.dataset.i,1)[0]; save(); render(); toast('Pedido de '+p.n+' recusado'); },
  role: el => { const m = band(el.dataset.b).members[+el.dataset.i]; m.r = m.r==='editor'?'membro':'editor'; save(); render(); toast(m.r==='editor'? m.n+' agora pode editar a versão da banda' : m.n+' edita só a própria cifra'); },
  copycode: el => { const v = el.dataset.v; navigator.clipboard?.writeText(v).then(()=>toast('Código '+v+' copiado'), ()=>toast('Código da banda: '+v)); },
  /* Conta (simulada) */
  authstep: el => { S.auth = {step: el.dataset.v, email: S.auth.email}; render(); },
  sso: el => { const m = el.dataset.v;
    if(sb){ toast(`Entrar com ${METHOD_NAME[m].replace('Conta ','')} chega em breve. Por enquanto, use o seu e-mail.`); document.getElementById('a-email')?.focus(); return; }
    DB.user = {method:m, email:'', name:'', inst:''}; save(); S.auth = {step:'onboard'}; render();
    toast(`Simulado: entrou com ${METHOD_NAME[m]}`); },
  sendcode: async () => { const e = document.getElementById('a-email').value.trim();
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e)){ S.auth = {...S.auth, email:e, err:'Confira o e-mail: ele precisa ter @ e um domínio, como voce@email.com.'}; render(); document.getElementById('a-email')?.focus(); return; }
    S.auth = {step:'login', email:e, busy:true}; render();
    if(sb){
      const {error} = await sb.auth.signInWithOtp({email:e, options:{shouldCreateUser:true}});
      if(error){ S.auth = {step:'login', email:e, err: authErr(error)}; render(); return; }
      S.auth = {step:'code', email:e}; render(); document.getElementById('a-code')?.focus(); return;
    }
    setTimeout(() => { S.auth = {step:'code', email:e}; render(); document.getElementById('a-code')?.focus(); }, 700); },
  resend: async () => { S.auth.err = ''; render();
    if(sb){ const {error} = await sb.auth.signInWithOtp({email:S.auth.email}); if(error){ S.auth.err = authErr(error); render(); } else toast('Código reenviado para ' + S.auth.email); return; }
    toast('Simulado: código reenviado para ' + S.auth.email); },
  verifycode: async () => { const v = document.getElementById('a-code').value.replace(/\D/g,'');
    if(sb ? (v.length < 6 || v.length > 10) : v.length !== OTP_LEN){ S.auth.err = `O código tem ${OTP_LEN} números.`; render(); document.getElementById('a-code')?.focus(); return; }
    S.auth.busy = true; render();
    if(sb){
      const {data, error} = await sb.auth.verifyOtp({email:S.auth.email, token:v, type:'email'});
      if(error){ S.auth = {...S.auth, busy:false, err: authErr(error)}; render(); document.getElementById('a-code')?.focus(); return; }
      try { await cloudLoad(data.user); } catch(e){ S.auth = {...S.auth, busy:false, err:'Entrou, mas não consegui buscar suas cifras. Confira a internet e tente de novo.'}; render(); return; }
      S.auth = {step:'login'}; S.choosing = true; render(); document.getElementById('a-name')?.focus(); return;
    }
    setTimeout(() => { DB.user = {method:'email', email:S.auth.email, name:'', inst:''}; save(); S.auth = {step:'onboard'}; render(); document.getElementById('a-name')?.focus(); }, 600); },
  pickinst: el => { S.auth.name = document.getElementById('a-name').value; S.auth.insts = toggleIn(S.auth.insts || [], el.dataset.v); render(); },
  finishonboard: () => { const n = document.getElementById('a-name').value.trim();
    if(!n){ S.auth = {...S.auth, err:'Diga como te chamam para continuar.'}; render(); document.getElementById('a-name')?.focus(); return; }
    DB.user.name = n; DB.user.insts = S.auth.insts || []; save(); S.auth = {step:'login'}; S.choosing = true; render(); },
  guest: () => { DB.user = {guest:true, name:'Visitante', inst:''}; save(); S.choosing = true; render(); },
  logout: async el => { const up = el.dataset.v === 'upgrade';
    if(sb && cloudUser){ // conta de verdade: as cifras ficam na nuvem; o aparelho volta ao começo
      clearTimeout(pushT); try { await sb.from('user_data').upsert({user_id: cloudUser.id, data: DB, updated_at: new Date().toISOString()}); } catch(e){}
      await sb.auth.signOut(); cloudUser = null; DB = normalizeDB(SEED()); try { localStorage.setItem(STORE, JSON.stringify(DB)); } catch(e){}
    } else { DB.user = null; save(); }
    S.auth = {step:'login'}; S.choosing = true; S.stack = [{name:'lib'}]; S.tab = 'lib'; stopScroll(); render();
    if(!up) toast(sb ? 'Você saiu. Suas cifras ficam salvas na sua conta.' : 'Você saiu da conta'); },
  setinst: el => { DB.user.insts = toggleIn(DB.user.insts || [], el.dataset.v); save(); render(); },
  joinband: () => DB.user?.guest ? toast('Para entrar numa banda, crie sua conta no Perfil') : openModal({name:'input', title:'Entrar numa banda', label:'Código de convite', ph:'Ex.: K7Q-42M', cta:'Pedir para entrar', kind:'join'}),
  newband: () => DB.user?.guest ? toast('Para criar uma banda, crie sua conta no Perfil') : openModal({name:'input', title:'Criar banda', label:'Nome da banda', ph:'Ex.: Ministério Aurora', cta:'Criar', kind:'band'}),
  minput: () => {
    const v = document.getElementById('m-in').value.trim(), k = S.modal.kind; if(!v){ toast('Preencha o campo para continuar'); return; }
    if(k==='folder'){ if(!DB.folders.includes(v)) DB.folders.push(v); S.f.folder = v; }
    if(k==='setlist'){ const m = S.modal, id = 'sl' + Date.now().toString(36);
      DB.setlists.unshift({id, band:m.band, name:v, date:today(), items: m.with ? [{song:m.with, st:V?.st||0}] : []});
      save(); closeModal(); S.slEdit = true; go('setlist', {id}); toast('Setlist criado' + (m.with ? ' com a música' : '') + '. Agora adicione as músicas na ordem do show.'); return; }
    if(k==='join'){ DB.bands.push({id:'j'+Date.now(), name:'Banda do código '+v.toUpperCase(), waiting:true, members:[], pending:[], songs:[]}); toast('Pedido enviado ao líder da banda'); }
    if(k==='band'){ const code = Math.random().toString(36).slice(2,5).toUpperCase()+'-'+Math.random().toString(36).slice(2,5).toUpperCase();
      DB.bands.push({id:'b'+Date.now(), name:v, code, role:'lider', members:[{n:'Você',r:'lider',i:'Guitarra'}], pending:[], songs:[]}); toast('Banda criada. Código de convite: '+code); }
    save(); closeModal(); render();
  },
  opensl: el => go('setlist', {id:el.dataset.id}),
  startstage: el => { const sl = DB.setlists.find(x=>x.id===el.dataset.id); openSong(sl.items[0].song, {stage:true, band:sl.band, st:sl.items[0].st}); go('perform', {sl:sl.id, i:0}); },
  stagego: el => stageGo(+el.dataset.v),
  exitstage: () => { stopScroll(); S.stack.pop(); render(); },
  reset: () => { const mode = DB.mode, user = DB.user, prefs = DB.prefs; DB = SEED(); DB.mode = mode; DB.user = user; DB.prefs = prefs; save(); toast('Dados de exemplo restaurados'); tab('lib'); }
};
/* Lê a cifra de uma página: pega o <pre> com mais linhas de acorde (é assim que a maioria dos sites publica) */
function extractCifra(html){
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const best = [...doc.querySelectorAll('pre')].map(p => p.textContent.replace(/\r/g,''))
    .map(t => ({t, n:t.split('\n').filter(isChordLine).length})).filter(x => x.n >= 2).sort((a,b) => b.n - a.n)[0];
  if(!best) return null;
  const meta = n => doc.querySelector(`meta[property="${n}"]`)?.content?.trim();
  const h1 = doc.querySelector('h1')?.textContent.trim(), h2 = doc.querySelector('h2')?.textContent.trim();
  const title = h1 || (meta('og:title') || doc.title || 'Sem título').split(/[-|–]/)[0].trim();
  return {title, artist: h2 && h2.length < 60 ? h2 : '', genre:'', text: cleanText(best.t).replace(/^\n+|\s+$/g,'')};
}
function stageGo(d){
  const c = cur(); if(c.name!=='perform' || V.edit) return;
  const sl = DB.setlists.find(x=>x.id===c.sl), i = c.i + d; if(i<0 || i>=sl.items.length) return;
  stopScroll(); c.i = i; const fs = V.fs, lk = V.locked; openSong(sl.items[i].song, {stage:true, band:sl.band, st:sl.items[i].st}); V.fs = fs; V.locked = lk; render();
}
/* Destravar a tela: segurar o botão por 0,7 s (um esbarrão não destrava) */
let holdT = null;
document.addEventListener('pointerdown', e => { const p = e.target.closest('#lockpill'); if(!p) return;
  p.classList.add('hold'); holdT = setTimeout(() => { V.locked = false; rerenderViewer(); toast('Tela destravada'); }, 700); });
['pointerup','pointercancel','pointerleave'].forEach(t => document.addEventListener(t, e => {
  if(t==='pointerleave' && e.target.id!=='lockpill') return;
  clearTimeout(holdT); document.getElementById('lockpill')?.classList.remove('hold'); }, true));
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if(el && A[el.dataset.act]) A[el.dataset.act](el, e); });
/* Conta: Enter envia; o código entra sozinho quando chegam os 6 números (inclusive pelo preenchimento automático) */
document.addEventListener('keydown', e => { if(e.key !== 'Enter') return;
  const act = {'a-email':'sendcode', 'a-code':'verifycode', 'a-name':'finishonboard'}[e.target.id]; if(act){ e.preventDefault(); A[act](); } });
document.addEventListener('input', e => { if(e.target.id==='a-code' && e.target.value.replace(/\D/g,'').length === OTP_LEN && !S.auth.busy) A.verifycode(); });
document.addEventListener('input', e => { if(e.target.id==='q'){ S.q = e.target.value; document.getElementById('libbody').innerHTML = libBody(); } });
document.addEventListener('keydown', e => {
  if(e.key==='Escape' && S.modal) closeModal();
  else if(e.key==='Escape' && V?.pop && /song|perform/.test(cur().name)){ V.pop = false; rerenderViewer(); }
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if(cur().name==='perform' && !S.modal && !typing){
    if(['ArrowRight','PageDown'].includes(e.key)){ e.preventDefault(); stageGo(1); }
    if(['ArrowLeft','PageUp'].includes(e.key)){ e.preventDefault(); stageGo(-1); }
  }
  /* Pedal/teclado na cifra: ↓ ↑ viram a "página", Espaço inicia ou pausa a rolagem */
  if(/song|perform/.test(cur().name) && !S.choosing && !S.modal && !typing && V && !V.edit){
    if(e.key==='ArrowDown' || e.key==='ArrowUp'){ e.preventDefault(); view.scrollBy({top:(e.key==='ArrowDown'?1:-1) * view.clientHeight * .8, behavior:'smooth'}); }
    if(e.key===' '){ e.preventDefault(); togglePlay(); }
  }
});
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if(V && song(V.id)?.score && /song|perform/.test(cur().name)) rerenderViewer(); else sizeInk(); }, 120); });
document.fonts?.ready.then(() => sizeInk());
/* Abertura: com a nuvem ligada, confere a sessão salva e busca as cifras da conta.
   Sem internet no ensaio, abre com a cópia do aparelho e envia as mudanças quando a conexão voltar. */
(async () => {
  if(sb){
    S.booting = true; render();
    try {
      const {data:{session}} = await sb.auth.getSession();
      if(session?.user){
        try { await cloudLoad(session.user); }
        catch(e){ cloudUser = session.user; sync = {state:'error', at:Date.now(), msg:'sem internet'}; }
      } else if(DB.user && !DB.user.guest){ DB.user = null; } // sessão vencida: pede o e-mail de novo
    } catch(e){}
    S.booting = false;
  }
  render();
})();
